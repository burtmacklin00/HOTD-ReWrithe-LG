# The House of the Dead: ReWrithe - the weapons of Survival Mode (docs/weapons.md)
# Each [weapon] section: key = value lines; a key left out (or this file missing) keeps the built-in value shown here.
# Times are in frames (the game runs at about 57.5 frames a second). Damage: percent of the handgun's own damage a hit.
#
# Sounds: put your own RIFF PCM .wav (8 / 16-bit, mono / stereo, any rate) into data/weapons/ named as fire_sound /
# reload_sound (e.g. data/weapons/rifle_fire.wav). Until a file is there the game's own sound plays as a stand-in:
# fire_standin_cue (a PC sound cue: 30 = the handgun's shot) fire_standin_speed times faster, cut to fire_standin_length
# of its length; fire_game_cue instead plays one of the game's own arcade cues (0xA01463: the Magician's projectile).
# The SMG's sounds are also found in data/survival/ (smg_fire.wav / smg_reload.wav: Survival's old place).
#
# Models (hex ids of the game's own models): pickup_model = the one floating over its shop sign / lying as a dropped
# pickup (0: the players' handgun without the hand). model = the one in the hand: not drawn (no weapon in a hand on the
# screen outside VR, as the arcade shows none; VR has its own hands).
#
# price = Survival's shop (0: not sold); drop_weight = how often dropped pickups are this weapon (0: never);
# auto_rank = the order of the light guns' "auto best weapon" (the highest with ammo).

[options]
auto_best_light_gun = 1        # a light gun's player gets the best weapon with ammo at each pull (0: switch by pad)

[pistol]
name = HANDGUN
magazine = 6
reload_frames = 36             # Survival

[smg]
name = SMG
magazine = 30
reserve_magazines = 4
reload_frames = 72
fire_period = 5                # held trigger: a shot every 5 frames (12 a second)
burst = 3                      # a pull from a pad / light gun: 3 shots
damage = 100
fire_sound = smg_fire
fire_standin_cue = 30
fire_standin_speed = 1.4
fire_standin_length = 0.4
fire_volume = 0.9
reload_sound = smg_reload
reload_standin_speed = 0.8
price = 1000
drop_weight = 4
auto_rank = 4

[rifle]
name = ASSAULT RIFLE
magazine = 30
reserve_magazines = 4
reload_frames = 84
fire_period = 6
burst = 4
damage = 140
fire_sound = rifle_fire
fire_standin_speed = 1.15
fire_standin_length = 0.55
reload_sound = rifle_reload
reload_standin_speed = 0.7
scale = 1.15
price = 2500
drop_weight = 3
auto_rank = 5

[dual]
name = DOUBLE PISTOLS
magazine = 16
reserve_magazines = 5
reload_frames = 60
damage = 200                   # survfix2: both guns hitting one creature count once (100: no better than the handgun)
dual = 14                     # the second gun's shot: this far right of the aim (and a third of it up)
fire_sound = dual_fire
fire_standin_speed = 1.2
fire_standin_length = 0.7
reload_sound = dual_reload
reload_standin_speed = 0.9
price = 1500
drop_weight = 3
auto_rank = 2

[shotgun]
name = SHOTGUN
magazine = 6
reserve_magazines = 5
reload_frames = 90
damage = 130                   # survfix2: pellets on one creature count once (100: slower than the SMG)
pellets = 6                   # extra rays round the aim ..
spread = 24                    # .. this far out (arcade screen units) ..
range = 170                    # .. hitting only nearer than this
fire_sound = shotgun_fire
fire_standin_speed = 0.7
fire_standin_length = 1.0
reload_sound = shotgun_reload
reload_standin_speed = 0.6
scale = 1.25
price = 3000
drop_weight = 3
auto_rank = 3

[hand]
name = MAGICIAN'S HAND
magazine = 4
reserve_magazines = 2
reload_frames = 120
damage = 350                   # survfix2 (was 250: slower on one creature than the rifle at twice the price)
area = 45                     # the explosion's radius: every creature this near the hit takes a hit
projectile = 1                 # the Magician's own fireball flies from the aim to the hit and explodes there (0: at once)
model = 0x1C6C                 # boss4_ter01: the Magician's right hand
pickup_model = 0x1C6C
scale = 0.8
fire_sound = hand_fire         # (no file: the game's own Magician's projectile, fire_game_cue)
fire_game_cue = 0xA01463
fire_standin_cue = 249          # his projectile's PC sample, played louder (user 2026-11-05: "make it louder")
fire_volume = 1.8
reload_sound = hand_reload
reload_standin_speed = 0.5
price = 8000                   # survfix2 (was 5000: a saver had it in round 5; now round 7, a buyer's round 8-9)
drop_weight = 1
auto_rank = 1

; VR mode settings and models (docs/vr.md). Read at the start of a VR run (hotd --vr preview | openxr).
; Every key is optional: a missing key keeps the default shown in its comment.

[vr]
; follow = follow (the game camera's full orientation, your head on top) | level (its heading only: the game's
; looks up / down are not forced on your head)
follow = follow
; the comfort vignette: the view's edges darken while the game camera turns faster than vignette_turn degrees / s
vignette = on
vignette_strength = 0.7
vignette_turn = 60
; the world's scale: game units per metre (10: the zombies about human height)
units_per_metre = 10
; the HUD on the arcade screen's plane, this many metres ahead; panel_depth_test = on hides it behind nearer walls
panel_distance = 3
panel_depth_test = off
; the aim when the gun's ray hits nothing the eye's depth knows (metres)
aim_distance = 8
; a faint laser from the muzzle to the crosshair; the crosshair's size in degrees (the same at any distance)
laser = on
crosshair_degrees = 2.5
; pointing the gun more than reload_pitch degrees below the horizon reloads (as a shot off the screen)
reload_down = on
reload_pitch = 55
left_hand = on
; the preview's eye distance (metres; a headset reports its own)
ipd = 0.064

; ---- the hands ----
; The hands are the game's own models, read from your game data like every other model: the AMS agents' right hand
; with the handgun (0x719 ter00a) on the right controller, Rogan's left hand (0x717 tel00a) on the left one. Nothing
; else is drawn (no models of ours). They are moved / turned from their default place with:
;   gun_offset = x y z            (metres along the controller's aim pose: x right, y up, -z ahead)
;   gun_rotate = pitch yaw roll   (degrees)
;   left_hand_offset = x y z      (metres along the left grip pose)
;   left_hand_rotate = pitch yaw roll
gun_offset = 0 0 0
gun_rotate = 0 0 0
left_hand_offset = 0 0 0
left_hand_rotate = 0 0 0

; ---- the Meta Quest build (docs/quest.md) ----
; the flat screens (setup, menus, the end screen) on a big screen in the headset, the right controller's ray as the
; mouse (trigger = click, B / Y / menu = back, A / X = Enter): auto = on on the Quest, off on a PC (the desktop window)
menu_panel = auto
; the big screen: metres ahead of where you look at the start, and its width in metres
menu_distance = 2.5
menu_width = 3.2
; performance (the Quest 3 runs at 72 Hz): the eyes' resolution x resolution_scale (0.5 .. 1.5 of the headset's
; recommended size; 0.8 if it stutters), the HUD panel's lines (960; 720 or 540 are cheaper), the arcade's polygon sort
; in the flat screens' 3D (auto = off on the Quest: the depth buffer, cheaper on OpenGL ES; VR's eyes never sort)
resolution_scale = 1.0
hud_lines = 960
arcade_sort = auto
; srgb_swapchain = off: the headset gets an RGBA8 picture instead of sRGB (try it if the colours look washed out)
srgb_swapchain = on

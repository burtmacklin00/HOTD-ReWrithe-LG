; VR mode settings and models (docs/vr.md). Read at the start of a VR run (hotd --vr preview | openxr).
; Every key is optional: a missing key keeps the default shown in its comment.

[vr]
; follow = follow (the game camera's full orientation, your head on top) | level (its heading only: the game's
; looks up / down are not forced on your head)
follow = follow
; the comfort vignette (off by default; on: for players who feel motion sick): the view's edges darken while the game camera turns faster than vignette_turn degrees / s
vignette = off
vignette_strength = 0.7
vignette_turn = 60
; the world's scale: game units per metre (10: the zombies about human height)
units_per_metre = 10
; the HUD on the arcade screen's plane, this many metres ahead; panel_depth_test = on hides it behind nearer walls
panel_distance = 3
panel_depth_test = off
; hud_distance = adaptive: the HUD comes forward to just in front of a creature nearer than panel_distance (a grab),
; never nearer than hud_min_distance metres, the same size to the eye; fixed: always at panel_distance
hud_distance = adaptive
hud_min_distance = 0.7
; the aim when the gun's ray hits nothing the eye's depth knows (metres)
aim_distance = 8
; how far the gun's ray goes: auto = the eye's depth on a PC, a CPU ray test against the level and the creatures on
; the Quest (OpenGL ES cannot read the depth); cpu = the CPU test always; depth = the eye's depth only
aim_depth = auto
; the game's shot flash and spark drawn on what you shot (on), not 10 cm before your eyes where the game puts them for
; the flat picture (off)
shot_flash_at_hit = on
; the headset back after more than auto_recentre seconds off your head: the view recentred by itself (off: never)
auto_recentre = 3
; a faint laser from the muzzle to the crosshair; the 3D crosshair (off: none drawn, the aim still works); the
; crosshair's size in degrees (the same at any distance). In a VR run Options > Gameplay > Laser (VR) / Crosshair (VR)
; override laser / crosshair once set there (launcher.ini vrlaser= / vrcrosshair=); these stay the defaults
laser = on
crosshair = on
crosshair_degrees = 2.5
; pointing the gun more than reload_pitch degrees below the horizon reloads (as a shot off the screen)
reload_down = on
reload_pitch = 55
; a pull off the arcade's screen: below = reloads only when aimed below the screen (or the gun pointed down); aimed at
; the world beside / above / behind the screen it does nothing (the crosshair greyed). any = every pull off the screen
; reloads (the light gun's rule)
offscreen_reload = below
; shake-to-reload: one brisk jolt of the gun controller in any direction (up, down, sideways, forward) or a shake of it,
; or a quick twist of the wrist and back, reloads (each gun with dual pistols), as a DualSense's shake does.
; shake_sensitivity = the jolt's acceleration in g (the twist scales with it): lower = easier, 2 is a brisk jolt
shake_reload = on
shake_sensitivity = 2
; wrist-flick reload: one sharp upward snap of the gun's muzzle (20 degrees or more: the Wii light-gun games' flick-up)
; reloads that gun; fast aiming, sideways and downward snaps never count. flick_sensitivity = the snap's speed (degrees
; a second the muzzle turns up): lower = easier, 300 is a brisk flick. A shake and a flick share one cooldown (one
; reload a gesture)
flick_reload = on
flick_sensitivity = 300
left_hand = on
; dual pistols = on: a gun in each hand (the game's gun hand, mirrored for the left), each controller aims and fires
; for itself (its own laser, crosshair, trigger and rumble), one magazine for both; the shots are player 1's.
; off: one gun (the right), the left hand empty. Survival's Double Pistols are always two guns in VR
dual_pistols = off
; around = on: the world all around you: the pieces of the neighbouring parts of the level that the arcade's camera
; never shows (behind and beside you) are drawn too when you turn your head. off: only what the arcade's view draws
around = on
; cut-scenes: world = they play around you (you stand where the game's camera is and look around freely; no black
; bars); cinema = the flat picture (bars, captions) on a big screen in front of you while a cut-scene plays, for
; comfort when the camera cuts fast: cinema_distance metres ahead, cinema_width metres wide
cutscenes = world
cinema_distance = 3
cinema_width = 4
; view: immersive = the world around you; screen = the whole game, play too, on that big screen (aim by pointing the
; gun at it; less motion sickness). Options > Gameplay > View (VR), Screen Distance / Size (VR), Cut-scenes (VR) and
; Comfort Vignette (VR) override these in the game once you change them
view = immersive
; the game's window on the PC while you play in VR: eye = one eye (the left), filling the window (its middle, never
; stretched); both = the two eyes side by side; spectator = the normal flat game picture from the game's camera with
; the HUD and your crosshair (for someone watching, or streaming / recording)
desktop_view = eye
; the preview's eye distance (metres; a headset reports its own)
ipd = 0.064

; ---- the hands ----
; The hands are the game's own models, read from your game data like every other model: the AMS agents' right hand
; with the handgun (0x719 ter00a) on the right controller, Rogan's left hand (0x717 tel00a) on the left one. Nothing
; else is drawn (no models of ours). They are moved / turned from their default place with:
;   gun_offset = x y z            (metres along the controller's aim pose: x right, y up, -z ahead)
;   gun_rotate = pitch yaw roll   (degrees)
;   left_hand_offset = x y z      (metres along the left grip pose)
;   left_hand_rotate = pitch yaw roll
gun_offset = 0 0 0
gun_rotate = 0 0 0
left_hand_offset = 0 0 0
left_hand_rotate = 0 0 0

; ---- the Meta Quest build (docs/quest.md) ----
; the flat screens (setup, menus, the end screen) on a big screen in the headset, the right controller's ray as the
; mouse (trigger = click, B / Y / menu = back, A / X = Enter): auto = on with a headset (the Quest and PC VR alike:
; the main menu first, in the headset); off = the menus flat on the monitor (the headset shows the runtime's own room)
menu_panel = auto
; the big screen: metres ahead of where you look at the start, and its width in metres
menu_distance = 2.5
menu_width = 3.2
; performance (the Quest 3 runs at 72 Hz): the eyes' resolution x resolution_scale (0.5 .. 1.5 of the headset's
; recommended size; 0.8 if it stutters), the HUD panel's lines (960; 720 or 540 are cheaper), the arcade's polygon sort
; in the flat screens' 3D (auto = off on the Quest: the depth buffer, cheaper on OpenGL ES; VR's eyes never sort)
resolution_scale = 1.0
hud_lines = 960
; the display's refresh rate: auto = 90 Hz on the Quest (a PC: the runtime's own), or 72 / 90 / 120; the CPU / GPU kept
; at sustained high while playing (off: the headset's own levels)
refresh_rate = auto
sustained_performance = on
arcade_sort = auto
; srgb_swapchain = off: the headset gets an RGBA8 picture instead of sRGB (try it if the colours look washed out)
srgb_swapchain = on
; the Quest only: fixed foveated rendering (off / low / medium / high: the edges of each eye, blurred by the lenses
; anyway, drawn at a lower resolution; foveation_dynamic: lowered while the GPU has time to spare), and a
; "quest perf" line a second in settings/hotd.log (frame rate, late frames, frame times, the threads' CPU)
foveation = high
foveation_dynamic = on
perf_log = on

; The Hermit Fly Head Mod (built into the game; docs/modding.md). This file is its manifest: the name and the help
; line the Mods page shows. The code is the game's own (type = hermithead): the Hermit, the Chapter 3 boss, drawn with
; the game's own unused second head (model boss31_kao 0x1AC6, two big glowing red eyes; docs/cut_content.md) in place
; of the one it uses (boss3_kao 0x1AD9). The arcade models only: the 1998 PC files have no such head, so with the PC
; models the Hermit keeps the PC's head. You can change the texts and the default here, not what the mod does.
[mod]
name = Hermit Fly Head Mod
author = ReWrithe
version = 1
description = The Hermit (the Chapter 3 boss) wears the game's own unused second head, with two big glowing red eyes (arcade models only; visual only)
type = hermithead
default = off

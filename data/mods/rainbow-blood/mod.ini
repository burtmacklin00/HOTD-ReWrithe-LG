; The Rainbow Blood mod (built into the game; docs/modding.md; GitHub #8). This file is its manifest: the name, the
; help line and the settings the Mods page shows. The code is the game's own (type = rainbowblood): you can change the
; texts, the defaults and the order of the choices here, not what the choices do.
[mod]
name = Rainbow Blood
author = ReWrithe
version = 1
description = The blood, the gore and the blood marks cycle through the colours of the rainbow (visual only)
type = rainbowblood
default = off

[settings]
; key = label | default | choice, choice, ... | help line
colours = Colours | Each Splash | Each Splash, Together | Each Splash: every splash and wound its own colour; Together: all blood one colour at a time
speed = Speed | Normal | Still, Slow, Normal, Fast | How fast the colours change
creature = Creature Blood | Rainbow Cycle | Rainbow Cycle, Own Colour Each, Off | The wounds painted on each creature: cycling with the rest, its own colour for its whole life, or as the game paints them
hud = HUD & Crosshair | Off | Off, Crosshair, HUD, Both | The players' crosshairs (each player its own phase) and / or HUD (bullets, 1P / 2P, torches, the score) in the rainbow too

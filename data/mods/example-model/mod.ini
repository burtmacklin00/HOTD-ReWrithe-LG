; An example model pack (docs/modding.md "Model packs"): one prop of Chapter 1 drawn as another mesh. Copy this folder,
; rename it, change the lines below. Turn it on in Options > Mods (it is off until you do: default = off).
;
; Nothing of the game's is in this folder: "file = game:<id>" takes the mesh from YOUR game files when the chapter
; loads. To start from a file you can edit instead, export the model from your own files:
;     hotd --export-models C:\work\export --model-ids 5e4 [--models pc]
; copy the .obj (with its .mtl and pictures) into this folder's models\, edit it in any 3D tool, and write
; "file = models\<its name>.obj" below (an .obj, .gltf or .glb). Do not share files exported from the game.
[mod]
name = Example: Model Pack
author = ReWrithe
version = 1
description = An example model pack: a dead researcher in the Chapter 1 courtyard lies in another pose (copy this folder to make your own)
type = models
default = off
models = both

; one [model] section per replacement
[model]
; the model replaced (object ID in hex): sitai_ken_b, the dead researcher lying farther along the courtyard path
; (the same ID in the arcade and the PC models)
id = 5e6
; its new mesh: the game's own sitai_ken_a (the other dead researcher there), from the player's files
file = game:5e4
; scale (one number, or x, y, z), then rotation (degrees about x, y, z), then offset (x, y, z), in the model's own space
scale = 1
rotation = 0, 90, 0
offset = 0, 0, 0
; arcade / pc / both: which Models setting this section is for (IDs can differ between the two: docs/modding.md)
models = both

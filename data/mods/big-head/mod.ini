; The Big Head mod (built into the game; docs/modding.md; GitHub #10). This file is its manifest: the name, the help
; line and the settings the Mods page shows. The code is the game's own (type = bighead): you can change the texts,
; the defaults and the order of the choices here, not what the choices do.
[mod]
name = Big Head
author = ReWrithe
version = 1
description = Big Head mode: the creatures' heads drawn big, the classic cheat (visual only: they are hit where the heads really are)
type = bighead
default = off

[settings]
; key = label | default | choice, choice, ... | help line
size = Head Size | 2x | 1.5x, 2x, 3x | How big the heads are
who = Heads | Everyone | Enemies, Everyone | Everyone: the people too (Rogan and G in the cut-scenes, Sophie, the researchers)
bosses = Bosses | On | On, Off | The bosses' heads too

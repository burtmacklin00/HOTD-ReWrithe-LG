# Release builds of The House of the Dead: ReWrithe (docs/release/build_release.md "CI").
# Runs on a version tag (git tag v1.0.0 && git push origin v1.0.0), by hand (Actions -> release -> Run workflow, with a
# choice of platforms) or on a push to the branch "ci" (a test build of every platform without a tag or a release).
# Every run only uploads the packages as artifacts (the run's Summary page -> Artifacts): nothing is published.
# Builds Windows x64, Linux x64 (also the SteamOS / Steam Deck build), macOS universal (arm64 + x86_64, unsigned),
# runs the tests that need no game data (--version, --mods-test, hotd_nettest, the unit tests hotd_unit; --gl-check on Mesa's software driver) and uploads each package as an artifact.
# NO GAME DATA is used or packaged. Nothing is published: making the GitHub Release from the artifacts stays manual.
# Every package is built with HOTD_EXPERIMENTAL_MODES=OFF (no unreleased mode: docs/porting.md "Experimental
# modes"); the tests check that --totd-test is accepted. The Typing of the Dead 0 is in
# (HOTD_TOTD_MODE=ON, labelled Experimental / Proof of Concept); Survival Mode is in (HOTD_SURVIVAL_MODE=ON); Horde Mode is in
# (HOTD_HORDE_MODE=ON, labelled Experimental / Proof of Concept, user 2026-11-09).
#
# Third-party sources fetched at build time (pinned; licences in NOTICE.md): SDL3 release-3.2.10 (zlib), stb_vorbis
# (public domain), dr_mp3 51e61d3 (public domain), Musashi 313ebf1 (MIT; its m68kfpu.c / m68kmmu.h / softfloat are
# removed: not used, other licences), MAME mame0289 scsp*.cpp / .h (BSD-3-Clause).
name: release

on:
  push:
    tags: ["v*"]
    # Light Gun Edition: every change pushed to main builds the Windows package by itself (a test build: Actions ->
    # the run -> Artifacts -> windows-x64); README-only changes build nothing
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which packages to build"
        type: choice
        default: all
        options: [all, linux-macos, linux, macos, windows]

# a newer push to the same branch / tag stops the older run (saves the runners' time)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL3_TAG: release-3.2.10
  MUSASHI_COMMIT: 313ebf1bd9f4d0d93341eb5ce21fd8a119e9dbdd
  DR_LIBS_COMMIT: 51e61d308dde6b437fce0c5fabb32cd86b40f4d7
  MAME_TAG: mame0289

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch third-party sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps && cd deps
          git clone -q https://github.com/kstenerud/Musashi musashi
          git -C musashi checkout -q "$MUSASHI_COMMIT"
          rm -rf musashi/m68kfpu.c musashi/m68kmmu.h musashi/softfloat musashi/.git
          git clone -q https://github.com/mackron/dr_libs dr_libs
          git -C dr_libs checkout -q "$DR_LIBS_COMMIT"
          git clone -q --depth 1 https://github.com/nothings/stb stb
          mkdir -p mame_scsp
          for f in scsp.cpp scsp.h scspdsp.cpp scspdsp.h; do
            curl -fsSL -o "mame_scsp/$f" "https://raw.githubusercontent.com/mamedev/mame/$MAME_TAG/src/devices/sound/$f"
          done
      # angle (docs/renderer_backends.md): ANGLE built by vcpkg's "angle" port from Google's sources (BSD): the DirectX
      # renderer's libEGL.dll / libGLESv2.dll / z.dll. Optional: without it the package is OpenGL only (a warning)
      - name: ANGLE (vcpkg)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install angle:x64-windows --disable-metrics
          mkdir -p deps/angle
          for f in libEGL.dll libGLESv2.dll z.dll; do cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/$f" deps/angle/; done
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DHOTD_ANGLE_DIR="$PWD/deps/angle"
          -DHOTD_LOCAL_ICON=OFF -DHOTD_FETCH_SDL3=ON -DHOTD_SDL3_TAG=$SDL3_TAG
          -DHOTD_STB_DIR="$PWD/deps/stb" -DHOTD_DR_LIBS_DIR="$PWD/deps/dr_libs"
          -DHOTD_ARCADE_SOUND=ON -DHOTD_MUSASHI_DIR="$PWD/deps/musashi" -DHOTD_SCSP_DIR="$PWD/deps/mame_scsp"
          -DHOTD_EXPERIMENTAL_MODES=OFF -DHOTD_TOTD_MODE=ON -DHOTD_SURVIVAL_MODE=ON -DHOTD_HORDE_MODE=ON
      - name: Build
        run: cmake --build build --config Release --parallel --target hotd hotd_viewer hotd_nettest hotd_unit
      - name: Tests (no game data)
        shell: bash
        run: |
          set -euo pipefail
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref"
          build/Release/hotd.exe --version | tee version.txt
          grep -q "v${GITHUB_REF_NAME#v}" version.txt || [ "$GITHUB_REF_TYPE" != tag ]
          build/Release/hotd.exe --mods-test
          ! (build/Release/hotd.exe --totd-test --frames 1 --arcade nonexistent.zip 2>&1 || true) | grep -q "not in this version"
          build/Release/hotd_nettest.exe
          ctest --test-dir build -C Release -L "^unit$" --output-on-failure   # hotd_unit (docs/testing.md "CTest")
      - name: Graphics test on Mesa's software driver (no game data)
        # compat (2026-10-29): mesa-dist-win's llvmpipe (strict OpenGL, no GPU on the runner) next to a copy of hotd.exe:
        # --gl-check compiles every start-up shader, draws the CRT filter and fails on any GL error / debug message
        shell: bash
        env:
          MESA_DIST_WIN: "26.2.4"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref_mesa"
          curl -fsSL -o "$RUNNER_TEMP/mesa.7z" "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_DIST_WIN/mesa3d-$MESA_DIST_WIN-release-msvc.7z"
          7z x -y -o"$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" "x64/opengl32.dll" "x64/libgallium_wgl.dll" "x64/dxil.dll" > /dev/null
          mkdir -p "$RUNNER_TEMP/mesa_run"
          cp build/Release/hotd.exe build/Release/SDL3.dll "$RUNNER_TEMP"/mesa/x64/*.dll "$RUNNER_TEMP/mesa_run/"
          "$RUNNER_TEMP/mesa_run/hotd.exe" --version
          "$RUNNER_TEMP/mesa_run/hotd.exe" --gl-check | tee gl-check.txt
          grep -q "llvmpipe" gl-check.txt
          MESA_GL_VERSION_OVERRIDE=3.3 MESA_GLSL_VERSION_OVERRIDE=330 "$RUNNER_TEMP/mesa_run/hotd.exe" --gl-check
      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "pkg\HOTD ReWrithe"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\make_portable_hotd.ps1 -Build build -Out $out -NoBuild
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            pkg/*.zip
            pkg/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    name: Linux x64 / SteamOS
    runs-on: ubuntu-latest
    # (Light Gun Edition: not on every push to main: tags and by hand only)
    if: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && (!inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')) }}
    # Valve's Steam Runtime 3 "sniper" SDK (Debian 11, glibc 2.31): the binary then runs on SteamOS 3 and older desktop
    # distributions too (docs/porting.md "SteamOS package")
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    # in a container the steps' default shell is sh (dash), which refuses "set -o pipefail" (exit 2: v1.2.0's run)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch third-party sources
        run: |
          set -euo pipefail
          mkdir -p deps && cd deps
          git clone -q https://github.com/kstenerud/Musashi musashi
          git -C musashi checkout -q "$MUSASHI_COMMIT"
          rm -rf musashi/m68kfpu.c musashi/m68kmmu.h musashi/softfloat musashi/.git
          git clone -q https://github.com/mackron/dr_libs dr_libs
          git -C dr_libs checkout -q "$DR_LIBS_COMMIT"
          git clone -q --depth 1 https://github.com/nothings/stb stb
          mkdir -p mame_scsp
          for f in scsp.cpp scsp.h scspdsp.cpp scspdsp.h; do
            curl -fsSL -o "mame_scsp/$f" "https://raw.githubusercontent.com/mamedev/mame/$MAME_TAG/src/devices/sound/$f"
          done
      - name: Configure
        # sniper's default GCC 10 lacks parts of C++20: use its newest GCC (linux2 2026-11-03: the SDK now ships gcc-14,
        # no gcc-12 any more; its static libstdc++.a is there: HOTD_STATIC_CXX_RUNTIME)
        run: |
          set -euo pipefail
          v=""; for n in 15 14 13 12; do if command -v "g++-$n" > /dev/null; then v=$n; break; fi; done
          [ -n "$v" ] || { echo "no gcc-12 or newer in the SDK" >&2; exit 1; }
          echo "compiler: g++-$v"
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-$v -DCMAKE_CXX_COMPILER=g++-$v \
          -DHOTD_FETCH_SDL3=ON -DHOTD_SDL3_TAG=$SDL3_TAG \
          -DHOTD_STB_DIR="$PWD/deps/stb" -DHOTD_DR_LIBS_DIR="$PWD/deps/dr_libs" \
          -DHOTD_ARCADE_SOUND=ON -DHOTD_MUSASHI_DIR="$PWD/deps/musashi" -DHOTD_SCSP_DIR="$PWD/deps/mame_scsp" \
          -DHOTD_EXPERIMENTAL_MODES=OFF -DHOTD_TOTD_MODE=ON -DHOTD_SURVIVAL_MODE=ON -DHOTD_HORDE_MODE=ON
      - name: Build
        run: cmake --build build-linux --parallel --target hotd hotd_viewer hotd_nettest hotd_unit
      - name: Tests (no game data)
        run: |
          set -euo pipefail
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref"
          ./build-linux/hotd --version
          ./build-linux/hotd --mods-test
          ! (./build-linux/hotd --totd-test --frames 1 --arcade nonexistent.zip 2>&1 || true) | grep -q "not in this version"
          ./build-linux/hotd_nettest
          ctest --test-dir build-linux -L "^unit$" --output-on-failure   # hotd_unit (docs/testing.md "CTest")
          # SteamOS / older distributions: only glibc and the bundled SDL (libstdc++ linked in: HOTD_STATIC_CXX_RUNTIME;
          # SDL built from source loads X11 / Wayland / audio at run time)
          ldd build-linux/hotd
          ! ldd build-linux/hotd | grep -q 'libstdc++'
          sdl="$(find build-linux/_deps -name 'libSDL3.so.0' | head -1)"
          ! ldd "$sdl" | grep -v -E 'linux-vdso|ld-linux|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so' | grep -q '=>'
      - name: Graphics test on Mesa's software driver (no game data)
        # compat (2026-10-29): the distribution's Mesa llvmpipe under a virtual X display. continue-on-error: the
        # container's package mirror is outside this project (a failed install must not stop a release); a real
        # --gl-check failure shows as this step's red mark in the run
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref_mesa"
          apt-get update -qq && apt-get install -y -qq xvfb xauth libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./build-linux/hotd --gl-check | tee gl-check.txt
          grep -q "llvmpipe" gl-check.txt
      - name: Package
        run: |
          set -euo pipefail
          bash tools/make_linux_package.sh -b build-linux -o "$GITHUB_WORKSPACE/pkg/HOTD ReWrithe Linux" --no-build
      - name: Package test (unpacked in a fresh folder, as a player would)
        # linux2 (2026-11-03): the tarball's own bin/hotd with its bundled libSDL3 (no build folder on the library path)
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/unpack"; rm -rf "$t"; mkdir -p "$t"
          (cd pkg && sha256sum -c SHA256SUMS-linux.txt)
          tar -C "$t" -xzf pkg/hotd-rewrithe-*-linux-x86_64.tar.gz
          p="$t/HOTD ReWrithe Linux"
          LD_LIBRARY_PATH= ldd "$p/bin/hotd" | grep -F "$p/bin/libSDL3.so.0"
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref_pkg"
          "$p/hotd.sh" --version
          "$p/bin/hotd" --mods-test
          ! ("$p/bin/hotd" --totd-test --frames 1 --arcade nonexistent.zip 2>&1 || true) | grep -q "not in this version"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            pkg/*.tar.gz
            pkg/SHA256SUMS-linux.txt
          if-no-files-found: error

  macos:
    name: macOS universal
    # (macos-latest: GitHub retires the numbered images over time; arm64, Xcode's clang builds both slices)
    runs-on: macos-latest
    # (Light Gun Edition: not on every push to main: tags and by hand only)
    if: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && (!inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch third-party sources
        run: |
          set -euo pipefail
          mkdir -p deps && cd deps
          git clone -q https://github.com/kstenerud/Musashi musashi
          git -C musashi checkout -q "$MUSASHI_COMMIT"
          rm -rf musashi/m68kfpu.c musashi/m68kmmu.h musashi/softfloat musashi/.git
          git clone -q https://github.com/mackron/dr_libs dr_libs
          git -C dr_libs checkout -q "$DR_LIBS_COMMIT"
          git clone -q --depth 1 https://github.com/nothings/stb stb
          mkdir -p mame_scsp
          for f in scsp.cpp scsp.h scspdsp.cpp scspdsp.h; do
            curl -fsSL -o "mame_scsp/$f" "https://raw.githubusercontent.com/mamedev/mame/$MAME_TAG/src/devices/sound/$f"
          done
      - name: Configure
        run: >
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DHOTD_FETCH_SDL3=ON -DHOTD_SDL3_TAG=$SDL3_TAG
          -DHOTD_STB_DIR="$PWD/deps/stb" -DHOTD_DR_LIBS_DIR="$PWD/deps/dr_libs"
          -DHOTD_ARCADE_SOUND=ON -DHOTD_MUSASHI_DIR="$PWD/deps/musashi" -DHOTD_SCSP_DIR="$PWD/deps/mame_scsp"
          -DHOTD_EXPERIMENTAL_MODES=OFF -DHOTD_TOTD_MODE=ON -DHOTD_SURVIVAL_MODE=ON -DHOTD_HORDE_MODE=ON
      - name: Build
        run: cmake --build build-mac --parallel --target hotd hotd_viewer hotd_nettest hotd_unit
      - name: Tests (no game data)
        run: |
          set -euo pipefail
          export HOTD_PREF_DIR="$RUNNER_TEMP/pref"
          ./build-mac/hotd --version
          ./build-mac/hotd --mods-test
          ! (./build-mac/hotd --totd-test --frames 1 --arcade nonexistent.zip 2>&1 || true) | grep -q "not in this version"
          ./build-mac/hotd_nettest
          ctest --test-dir build-mac -L "^unit$" --output-on-failure   # hotd_unit (docs/testing.md "CTest")
          lipo -archs build-mac/hotd | grep -q "x86_64 arm64\|arm64 x86_64"
      - name: Package (folder + a small unsigned .app that starts bin/hotd)
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-mac/CMakeCache.txt)"
          root="$GITHUB_WORKSPACE/pkg"; out="$root/HOTD ReWrithe macOS"
          mkdir -p "$out/bin"
          cp build-mac/hotd build-mac/hotd_viewer "$out/bin/"
          sdl="$(find build-mac/_deps -name 'libSDL3.0.dylib' | head -1)"
          cp -L "$sdl" "$out/bin/libSDL3.0.dylib"
          echo "The House of the Dead: ReWrithe, portable package (no game data)." > "$out/hotd_package.txt"
          for d in ui fonts lang mods typing subtitles; do mkdir -p "$out/data/$d"; cp -R "data/$d/." "$out/data/$d/"; done
          # the modes left out leave the language files too (their "# [unreleased]" sections, as the Windows package)
          for f in "$out"/data/lang/*.txt; do
            awk '/^[ \t]*#[ \t]*\[unreleased\]/ { s = 1; next } /^[ \t]*#[ \t]*\[\/unreleased\]/ { s = 0; next } !s' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          ! grep -rq "\[unreleased\]" "$out/data/lang"
          mkdir -p "$out/data/arcade" "$out/data/pc" "$out/data/music"
          echo "Put your own arcade ROM zip here (MAME's 'hotd' set, Revision A)." > "$out/data/arcade/put the arcade ROM zip here.txt"
          echo "Put your own 1998 PC game here (its installed folder's contents, or a .zip of it)." > "$out/data/pc/put the PC game here.txt"
          echo "Optional: the PC CD's music, Track02.ogg ... Track12.ogg (or .mp3)." > "$out/data/music/put the music here.txt"
          cp LICENSE "$out/LICENSE.txt"; cp NOTICE.md "$out/NOTICE.txt"; cp docs/release/CREDITS.txt "$out/CREDITS.txt"; cp CHANGELOG.md "$out/CHANGELOG.txt"; cp docs/online_howto.md "$out/ONLINE HOWTO.txt"
          cp README.md "$out/README.md"
          printf '#!/bin/sh\ncd "$(dirname "$0")" || exit 1\nexec ./bin/hotd "$@"\n' > "$out/hotd.command"
          printf '#!/bin/sh\n# the setup: the game files check, Install (a copy in a folder you choose) or Play from here\ncd "$(dirname "$0")" || exit 1\nexec ./bin/hotd --setup "$@"\n' > "$out/hotd-setup.command"
          app="$out/HOTD ReWrithe.app"; mkdir -p "$app/Contents/MacOS"
          # linux2 (2026-11-03): a downloaded (quarantined) unsigned .app is run from a random read-only copy (App
          # Translocation): no bin/ beside it then; say how to clear the quarantine instead of failing silently
          cat > "$app/Contents/MacOS/hotd-launcher" <<'EOS'
          #!/bin/sh
          # starts bin/hotd of the folder this .app sits in
          here="$(cd "$(dirname "$0")/../../.." && pwd)"
          if [ ! -x "$here/bin/hotd" ]; then
              osascript -e 'display alert "HOTD ReWrithe" message "macOS started this app from a temporary copy (it was downloaded and is not signed by Apple), so it cannot find its bin folder.\n\nOpen Terminal, type  xattr -dr com.apple.quarantine  and a space, drag the HOTD ReWrithe macOS folder into the window, press Return, then open the app again (HOW TO OPEN.txt)."' > /dev/null 2>&1
              exit 1
          fi
          cd "$here" || exit 1
          exec ./bin/hotd "$@"
          EOS
          cat > "$out/HOW TO OPEN.txt" <<'EOS'
          The House of the Dead: ReWrithe - macOS (11 Big Sur or newer; Apple Silicon and Intel)
          ================================================================================

          This package is not signed by Apple (no paid developer account), so macOS asks before the first start:

          1. Unzip the download and move the "HOTD ReWrithe macOS" folder where you want it (e.g. your Applications or
             Games folder). Keep the folder together: the app starts bin/hotd from it.
          2. Clear the download flag once (it covers every file in the folder): open Terminal, type
                 xattr -dr com.apple.quarantine
             (with a space at the end), drag the "HOTD ReWrithe macOS" folder into the Terminal window, press Return.
             Without this, macOS runs the app from a temporary copy and it cannot find its files.
          3. Right-click (or Control-click) "HOTD ReWrithe.app" -> Open -> Open. On macOS 15 Sequoia and newer: double-click
             it, press Done, then System Settings -> Privacy & Security -> scroll down -> "Open Anyway" for HOTD ReWrithe.
             macOS remembers the choice: from then on a double-click starts it.
          4. Your own game files: the arcade ROM zip (MAME's "hotd" set) in data/arcade, the 1998 PC game (its folder or a
             .zip of it) in data/pc, the CD music (Track02 ... Track12) in data/music. Or double-click hotd-setup.command:
             it checks the files and copies them in for you.
          Mouse = gun (left shoots, right reloads); a game pad works too. Settings and the log are in the folder's settings/.
          Updates: the game says when a new version is out; download the new zip (macOS does not update itself).
          EOS
          chmod +x "$out/hotd.command" "$out/hotd-setup.command" "$app/Contents/MacOS/hotd-launcher" "$out/bin/hotd" "$out/bin/hotd_viewer"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>hotd-launcher</string>
            <key>CFBundleIdentifier</key><string>io.github.hotd-rewrithe.launcher</string>
            <key>CFBundleName</key><string>HOTD ReWrithe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # ad-hoc signatures (not a Developer ID: Gatekeeper still asks; README / release notes say how to open it)
          codesign --force -s - "$out/bin/libSDL3.0.dylib" "$out/bin/hotd" "$out/bin/hotd_viewer"
          codesign --force -s - "$app"
          # linux2 (2026-11-03): the packaged exe loads the bundled SDL (@rpath -> @loader_path), the .app's launcher finds bin/
          otool -L "$out/bin/hotd" | grep -q "@rpath/libSDL3"
          otool -l "$out/bin/hotd" | grep -A2 LC_RPATH | grep -q "@loader_path"
          HOTD_PREF_DIR="$RUNNER_TEMP/pref_pkg" "$out/bin/hotd" --version
          HOTD_PREF_DIR="$RUNNER_TEMP/pref_pkg" "$app/Contents/MacOS/hotd-launcher" --version
          rm -rf "$out/settings"   # (the two runs above made it: the package ships without one)
          # no game data
          ! find "$out" -type f -not -path '*/data/typing/ding.wav' \( -iname '*.zip' -o -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.rbh' -o -iname '*.bin' -o -iname 'thotd.exe' \) | grep -q .
          (cd "$root" && ditto -c -k --keepParent "HOTD ReWrithe macOS" "hotd-rewrithe-v${ver}-macos-universal.zip" \
            && shasum -a 256 "hotd-rewrithe-v${ver}-macos-universal.zip" > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            pkg/*.zip
            pkg/SHA256SUMS-macos.txt
          if-no-files-found: error
